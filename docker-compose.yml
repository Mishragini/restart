x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: api-server
    env_file: .env
    command: ["pnpm", "--filter", "@repo/db", "db:deploy"]
    restart: "no"
    <<: *default-logging

  api-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: api-server
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    <<: *default-logging

  ws:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: ws
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-}
    <<: *default-logging

  engine:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: engine
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    <<: *default-logging

  archiver:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: archiver
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    <<: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api-server
      - ws
    <<: *default-logging

volumes:
  caddy_data:
  caddy_config:
